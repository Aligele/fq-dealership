<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FQ Dealership – Sell Your Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--navy:#0E2038;--ink:#0B1626;--orange:#F0782A;--dk-orange:#B34A0C;--mut:#4A5A74;--line:#C9D2E0;--bg:#F4F6FA;--tint:#E9EEF6;--plate:#F4C20D}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;margin:0;line-height:1.02;letter-spacing:.005em}
h2{font-size:clamp(38px,5.4vw,60px);text-transform:uppercase}
h3{font-size:26px;text-transform:uppercase}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.topbar{background:var(--ink);color:#DDE5F1;font-size:14px;padding:9px 20px;text-align:center}
.topbar b{color:var(--orange);margin-left:14px;font-weight:600}
header.site{background:rgba(14,32,56,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;border-bottom:1px solid #1E3354}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:11px;padding-bottom:11px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.logo{width:44px;height:44px;border-radius:12px;background:var(--orange);color:var(--ink);display:flex;align-items:center;justify-content:center;font:800 26px 'Big Shoulders Display',sans-serif;flex:none}
.brand .n{font:800 22px/1.05 'Big Shoulders Display',sans-serif;letter-spacing:.04em;display:block}
.brand .t{font-size:11px;letter-spacing:.16em;color:#F0A468;font-weight:600;display:block;text-transform:uppercase}
nav.site{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:12px;border:0;background:var(--orange);color:var(--ink);font:600 16px 'Instrument Sans',sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:focus-visible,.fld:focus,.chip:focus-visible,.link:focus-visible,summary:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn.big{height:56px;padding:0 30px;font-size:18px}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid #3A5078}
.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.green{background:#157A4A;color:#fff}.btn.red{background:#B3261E;color:#fff}.btn.amber{background:#FFD9B8}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.hero{background:radial-gradient(1100px 520px at 85% -10%,#1B3A66 0%,rgba(27,58,102,0) 60%),linear-gradient(180deg,#0E2038 0%,#0B1626 100%);color:#fff;padding:clamp(44px,8vw,96px) 0 0;overflow:hidden}
.hero h1{font-size:clamp(58px,11.5vw,138px);line-height:.92;text-transform:uppercase;margin:0 0 22px}
.lead{font-size:clamp(18px,2.2vw,22px);line-height:1.6;color:#B9C6DA;max-width:640px;margin:0 0 30px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.perks{list-style:none;padding:0;margin:40px 0 0;display:flex;flex-wrap:wrap;gap:14px 36px;color:#C9D4E6;font-size:16px}
.perks li{display:flex;align-items:center;gap:10px}.perks b{color:#fff;font-weight:600}
.perks svg{flex:none}
.road{position:relative;margin-top:clamp(20px,4vw,40px);height:clamp(130px,22vw,250px)}
.road .car{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(1080px,112%);height:100%}
.road .line{position:absolute;left:0;right:0;bottom:0;height:0;border-top:3px dashed #2A426B}
.car path,.car circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.3,.6,.2,1) .25s forwards}
.car circle{animation-delay:1.3s;animation-duration:1s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.car path,.car circle{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}.btn:hover{transform:none}}
.sec{padding:clamp(56px,8vw,104px) 0}
.sec.tint{background:var(--tint)}
.sub{color:var(--mut);font-size:19px;line-height:1.6;max-width:600px;margin:14px 0 0}
.route{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;position:relative}
.route::before{content:"";position:absolute;top:21px;left:21px;right:21px;border-top:3px dashed #B9C4D6}
.route li{position:relative}
.route .stop{position:relative;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font:800 24px 'Big Shoulders Display',sans-serif;margin-bottom:18px;box-shadow:0 0 0 6px #fff}
.route h3{margin-bottom:8px}.route p{margin:0;color:var(--mut);max-width:260px}
@media (max-width:820px){.route{grid-template-columns:1fr;gap:30px}.route::before{top:22px;bottom:22px;left:21px;right:auto;border-top:0;border-left:3px dashed #B9C4D6}.route li{padding-left:66px}.route .stop{position:absolute;left:0;top:0;margin:0}.route p{max-width:none}}
.cols{display:flex;flex-wrap:wrap;gap:44px 64px;align-items:flex-start}
.side{flex:1 1 320px;min-width:0}
.checks{list-style:none;padding:0;margin:30px 0 0;display:flex;flex-direction:column;gap:20px}
.checks li{display:flex;gap:14px;color:var(--mut)}.checks b{color:var(--ink)}.checks svg{flex:none;margin-top:2px}
.already{margin-top:30px;color:var(--mut)}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:clamp(22px,4vw,38px);box-shadow:0 18px 50px -20px rgba(14,32,56,.35)}
.formcard{flex:1.25 1 360px;min-width:0}
.fld{width:100%;height:52px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px}
.fld:focus{border-color:var(--navy)}
textarea.fld{height:100px;padding:12px 14px;resize:vertical}
label.l{display:block;font-size:14px;font-weight:600;margin:0 0 6px;color:#1B2B45}
.opt{font-weight:400;color:#6B7A93}
.g{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}.g>div{flex:1 1 180px;min-width:0}
.sect{display:block;font:800 22px 'Big Shoulders Display',sans-serif;text-transform:uppercase;color:var(--navy);margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--tint)}
.drop{border:2px dashed #B9C4D6;border-radius:14px;background:var(--bg);padding:20px;text-align:center}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.msg{padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.5;margin:12px 0}
.msg.err{background:#FDECEA;color:#8A1C14}.msg.ok{background:#E3F4EA;color:#0F5B36}.msg.info{background:#EAF0FA;color:#1B2B45}
.ref{font:800 40px/1 'Big Shoulders Display',sans-serif;letter-spacing:.14em;background:var(--plate);color:#151A22;border:3px solid #151A22;border-radius:10px;padding:10px 22px 8px;display:inline-block;margin:8px 0;box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 5px #151A22}
.faq{margin-top:28px;border-top:1.5px solid var(--line)}
.faq details{border-bottom:1.5px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 2px;font-weight:600;font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:500 28px/1 'Instrument Sans';color:var(--dk-orange);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin:0 0 20px;color:var(--mut);max-width:640px}
footer.site{background:var(--ink);color:#B7C3D6;padding:36px 0;font-size:15px;line-height:1.7}
footer.site b{color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.b-pending{background:#FFF1D6;color:#7A4B00}.b-approved{background:#DDF3E6;color:#0F5B36}.b-rejected{background:#FBE0DD;color:#8A1C14}.b-info_needed{background:#E1EAFB;color:#1D3F8A}
/* admin */
body[data-route=admin]{background:var(--bg)}
.adm{padding:28px 22px 70px}
.adm h2{font-size:44px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px 'Instrument Sans',sans-serif;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;cursor:pointer;border:1.5px solid transparent;width:100%;text-align:left;font:inherit;color:inherit;box-shadow:0 1px 2px rgba(14,32,56,.06)}
.item:hover{border-color:var(--navy)}
.item .t{font-weight:600;font-size:17px}.item .s{font-size:14px;color:var(--mut)}
.detail{background:#fff;border-radius:16px;padding:clamp(16px,3vw,28px);margin-top:14px;border:2px solid var(--navy)}
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px}
.photos img{width:140px;height:105px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.decide{background:var(--bg);border-radius:14px;padding:16px;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14.5px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid #E6EBF3;vertical-align:middle}
.tbl th{background:#EEF2F8;font-size:12.5px;color:var(--mut)}
.scroll{overflow-x:auto}
.link{background:none;border:0;color:var(--dk-orange);font-weight:600;font-family:inherit;font-size:inherit;cursor:pointer;text-decoration:underline;padding:0}
.hide{display:none!important}
.help{background:#fff;border-radius:14px;border:1.5px solid var(--line);padding:4px 18px;margin:14px 0 0}
.help summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"+";color:var(--dk-orange);font-size:24px;line-height:1}
.help[open] summary::after{content:"–"}
.help dl{margin:0 0 12px;display:grid;gap:10px}
.help dt{font-weight:600}.help dd{margin:2px 0 0;color:var(--mut);font-size:15px}
.hint{font-size:14.5px;color:var(--mut);line-height:1.5;margin:6px 0 14px}
.acts{display:grid;gap:8px;margin-top:12px}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.act .btn{min-width:150px}.act span{font-size:14px;color:var(--mut);flex:1 1 200px;line-height:1.45}
@media (max-width:600px){.brand .t{display:none}.brand .n{font-size:19px}.logo{width:38px;height:38px;font-size:22px}body[data-route=admin] nav.site [data-go=status]{display:none}}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>

<script>
const SB_URL='https://enpwvgtgavtfnbhapdcf.supabase.co';
const SB_KEY='sb_publishable_qzFzLY-ZddliZZtEfRiUiA_lAdUcrq7';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ico={cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2.2 2.2L15 10.4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'};
const svg=k=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F0782A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ico[k]}</svg>`;

/* ---------- routing ---------- */
const app=$('#app');
function go(r){location.hash=r?'#'+r:'#';route();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go)}const sc=e.target.closest('[data-scroll]');if(sc){e.preventDefault();const el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView({behavior:'smooth'})}});
window.addEventListener('hashchange',route);
function route(){const h=location.hash.replace('#','');
  $('#nav').innerHTML=`<button class="btn sm ghost" data-go="status">Check my offer</button>`;document.body.dataset.route=h||'home';
  if(h==='status')return viewStatus();

app.innerHTML=`

<path pathLength="1" d="M60 200 L60 168 Q60 150 80 146 L176 128 Q214 74 292 66 L508 66 Q590 70 636 118 L768 134 Q836 144 846 172 L850 200 L770 200 A42 42 0 0 0 686 200 L274 200 A42 42 0 0 0 190 200 Z"/>

function formView(){
const c=$('#formcard');
c.innerHTML=`<h3 style="font-size:36px">Sell your car</h3>

<span class="sect">PHOTOS</span>
<div class="drop"><input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple style="max-width:100%"><p style="margin:10px 0 0;font-size:14px;color:var(--mut)">Add exterior, interior and odometer shots (up to 8 photos, 5 MB each, JPG/PNG/WebP).</p><div class="thumbs" id="thumbs"></div></div>

let files=[];
$('#photos').addEventListener('change',e=>{
  files=[...e.target.files].slice(0,8);
  const th=$('#thumbs');th.innerHTML='';
  files.forEach(f=>{const i=document.createElement('img');i.alt='';i.src=URL.createObjectURL(f);th.appendChild(i)});});
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const v=id=>$('#'+id).value.trim();
  const err=m=>{$('#ferr').innerHTML=`<div class="msg err" role="alert">${esc(m)}</div>`};
  const year=parseInt(v('year'),10),mileage=parseInt(v('mileage').replace(/[^\d]/g,''),10);
  if(!(year>=1950&&year<=new Date().getFullYear()+1))return err('Enter a valid 4-digit year.');
  if(!v('make')||!v('model'))return err('Make and model are required.');
  if(!(mileage>=0))return err('Enter the mileage in km.');
  if(!v('condition'))return err('Select the car condition.');
  if(!v('seller_name'))return err('Enter your name.');
  if(v('phone').replace(/\D/g,'').length<7)return err('Enter a valid phone number.');
  if(!/^\S+@\S+\.\S+$/.test(v('email')))return err('Enter a valid email address.');
  for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type))return err('Photos must be JPG, PNG or WebP.');if(f.size>5*1024*1024)return err(`"${f.name}" is over 5 MB.`)}
  const btn=$('#fsend');btn.disabled=true;btn.textContent='Sending…';$('#ferr').innerHTML='';
  try{
    const id=crypto.randomUUID(),paths=[];
    for(let i=0;i<files.length;i++){
      const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[files[i].type];
      const p=`${id}/${i+1}.${ext}`;
      const {error}=await sb.storage.from('fq-photos').upload(p,files[i],{contentType:files[i].type});
      if(error)throw error;paths.push(p);}
    const {data,error}=await sb.rpc('fq_submit',{p:{id,year,make:v('make'),model:v('model'),trim:v('trim'),mileage,condition:v('condition'),vin:v('vin'),seller_name:v('seller_name'),phone:v('phone'),email:v('email'),notes:v('notes'),photo_paths:paths}});
    if(error)throw error;
    $('#formcard').innerHTML=`<h3 style="font-size:32px">Request received</h3>
<div class="msg ok">Thank you, ${esc(v('seller_name'))}. Our reviewer will check your car and get back to you, usually within a day.</div>
<p style="margin:0">Your reference code:</p><div class="ref">${esc(data)}</div>
<p style="color:var(--mut);line-height:1.6">Keep this code. Use it with your phone number to check your offer at any time.</p>
<button class="btn" data-go="status">Check my offer</button>`;
  }catch(ex){err('Could not send your request: '+(ex.message||'please try again.'));btn.disabled=false;btn.textContent='Request my offer'}
});}

    if(msg)return er(msg);
    await loadAll();adminShell();
    const b=$('#pane');if(b)b.insertAdjacentHTML('afterbegin',`<div class="msg ok">${esc(email)} can now sign in as ${esc(role)}.${data.created?' Share the password with them.':' They already had a login, so their existing password still works.'}</div>`);});
  $('#pane').querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('fq_staff').update({role:s.value}).eq('user_id',s.dataset.role);if(error)return $('#serr').innerHTML=`<div class="msg err">${esc(error.message)}</div>`;await loadAll();adminShell()});
  $('#pane').querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Click again to confirm';return}const {error}=await sb.from('fq_staff').delete().eq('user_id',b.dataset.rm);if(error)return $('#serr').innerHTML=`<div class="msg err">${esc(error.message)}</div>`;await loadAll();adminShell()});}
function paneLogIntro(){return `<p class="hint" style="margin-top:0">Every decision and deletion is recorded here with who made it and when. It cannot be edited. Shows the latest 100 entries.</p>`}
function paneLog(){
  const name=id=>{const t=A.staff.find(s=>s.user_id===id);return t?t.email:(id===A.me.user_id?A.me.email:'staff')};
  $('#pane').innerHTML=paneLogIntro()+`<div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead><tbody>${A.events.map(e=>{const d=e.detail||{};const what=e.action==='delete'?`Deleted ${d.car||''} (${d.ref||''})`:`Status ${LBL[d.status_from]||d.status_from} → ${LBL[d.status_to]||d.status_to}${d.offer_to!=null?`, offer ${kes(d.offer_to)}`:''}`;return`<tr><td>${esc(when(e.created_at))}</td><td>${esc(name(e.actor))}</td><td>${esc(what)}</td></tr>`}).join('')||'<tr><td colspan="3">No activity yet.</td></tr>'}</tbody></table></div>`;}

route();
</script>
